<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Transport Schedule · KNUST UITS</title>
  <meta name="description" content="KNUST UITS published transport schedule">
  <link rel="icon" href="/knust-logo.png">
  <link rel="stylesheet" href="/css/styles.css">
  <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <style>
    body{margin:0;background:var(--bg,#f6f7f9);color:var(--text,#1a1a1a);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .pub-wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
    .pub-head{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:3px solid #009540;margin-bottom:18px}
    .pub-head img{height:46px}
    .pub-head h1{margin:0;font-size:20px}
    .pub-head .sub{color:var(--text-2,#666);font-size:13px;margin-top:2px}
    .pub-centre{background:var(--surface,#fff);border:1px solid var(--border,#e5e5e5);border-radius:12px;padding:14px 16px;margin-bottom:12px}
    .pub-centre h2{margin:0 0 8px;font-size:16px;color:#009540}
    .pub-centre .region{color:var(--text-2,#777);font-weight:400;font-size:13px}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border,#eee);font-size:14px}
    th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-2,#888)}
    .lead{display:inline-block;background:#e6f6ed;color:#009540;border-radius:999px;font-size:11px;padding:1px 8px;margin-left:6px}
    .pub-foot{margin-top:24px;color:var(--text-2,#888);font-size:12px;text-align:center}
    .pub-msg{background:var(--surface,#fff);border:1px solid var(--border,#e5e5e5);border-radius:12px;padding:40px 20px;text-align:center;color:var(--text-2,#777)}
  </style>
</head>
<body>
  <div class="pub-wrap">
    <div class="pub-head"><img src="/knust-logo.png" alt="KNUST"><div><h1>Transport Schedule</h1><div class="sub">KNUST · University Information Technology Services</div></div></div>
    <div id="out"><div class="pub-msg">Loading…</div></div>
    <div class="pub-foot">This is a published roster. For changes, contact the transport scheduling office.</div>
  </div>
  <script src="/js/ts-schedule-public.js"></script>
</body>
</html>
