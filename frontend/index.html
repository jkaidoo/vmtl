<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/knust-logo.png" />
    <link rel="apple-touch-icon" href="/knust-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#009540" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UITS VMTL" />
    <title>UITS Vehicle Management</title>
    <!-- No-flash theme stamp: applies the stored choice before first paint (MASTER_DOC §3). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Themed boot splash (removed once the app mounts). -->
    <div id="app-splash">
      <img src="/knust-logo.png" width="72" height="72" alt="KNUST" />
      <div class="splash-name">UITS Vehicle Management</div>
      <div class="splash-ball"></div>
    </div>
    <style>
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #f5f7f9; transition: opacity .25s ease;
      }
      #app-splash img { object-fit: contain; }
      .splash-name { font-family: "Segoe UI", system-ui, sans-serif; font-weight: 600; color: #111820; }
      .splash-ball { width: 14px; height: 14px; border-radius: 999px; background: #009540; animation: splash-bounce .6s infinite ease-in-out; }
      @keyframes splash-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #app-splash { background: #0c1015; }
        :root:not([data-theme="light"]) .splash-name { color: #e7edf3; }
        :root:not([data-theme="light"]) .splash-ball { background: #16b85c; }
      }
      :root[data-theme="dark"] #app-splash { background: #0c1015; }
      :root[data-theme="dark"] .splash-name { color: #e7edf3; }
      :root[data-theme="dark"] .splash-ball { background: #16b85c; }
      @media (prefers-reduced-motion: reduce) { .splash-ball { animation: none; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
