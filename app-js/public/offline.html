<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · UITS VMTL</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
  <div class="content center" style="max-width:420px;margin:12vh auto">
    <img src="/knust-logo.png" alt="KNUST" style="width:56px;height:56px;object-fit:contain">
    <h1>You're offline</h1>
    <p class="muted">UITS VMTL needs a connection to load live data. Reconnect and try again.</p>
    <button class="btn btn-primary" onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
